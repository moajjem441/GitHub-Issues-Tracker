<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Issue Tracker</title>

    <!-- google font  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">





    <!-- font awesome  cdn-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />


    <!-- tainwind + daisi ui -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>


    <!-- style css  -->
    <link rel="stylesheet" href="style/style.css">

</head>

<body>

    <!-- header starts from here -->
    <header class="flex justify-between items-center  border-b-2 border-gray-300 p-3">
        <div class="left flex justify-start pl-8 py-5 gap-2 items-center">

            <div><img class="w-[40px] h-[40px]" src="./assets/github-logo.png" alt=""></div>
            <div>
                <h1 class="text-2xl font-bold">GitHub Issues Tracker</h1>
            </div>

        </div>


        <div class="right flex justify-between items-center px-10 gap-3">

            <label class="input">
                <svg class="h-[2em] opacity-50 " xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" >
                    <g stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5" fill="none"
                        stroke="currentColor" >
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.3-4.3"></path>
                    </g>
                </svg>
                <input type="search" required placeholder="Search issues"  class="text-xl"/>
            </label>
            <button class="btn btn-primary"> <i class="fa-solid fa-plus"></i>New Issues</button>

        </div>
    </header>

    <!-- header ends from here -->



    <!--main three button starts from here -->

    <section id="three-buttons" class="w-11/12 mx-auto mt-20 border-2 border-gray-200 p-7 shadow-sm grid flex-wrap">

        <div id="button-container" class="space-x-8 ">
            <button id="all-btn" onclick="toggle('all-btn'),loadAllData()" class="text-2xl text-gray-600 font-bold border-1 border-gray-300 px-10 py-2 active">All</button>
            <button id="open-btn" onclick="toggle('open-btn')" class="text-2xl text-gray-600 font-bold border-1 border-gray-300 px-10 py-2">Open</button>
            <button id="close-btn" onclick="toggle('close-btn')" class="text-2xl text-gray-600 font-bold border-1 border-gray-300 px-10 py-2">Closed</button>
        </div>

    </section>

    <!-- main three button ends from here -->


    <!-- main part starts from here -->   
    
   <section  class="w-11/12 mx-auto mt-5 border-2 border-gray-200  shadow-sm">


    <!-- top part of 50 issues starts from here -->

     <div class="top-part border-b-2 border-gray-300 w-full p-4 flex justify-between">
        <div class="left flex justify-start items-center gap-2">

            <div class="left bg-gray-300 rounded-full p-2">
                <img src="./assets/Aperture.png" alt="">
            </div>

            <div class="right">

                <h1 class="text-2xl text-gray-600 font-bold">50 Issues</h1>
                <p class="text-xl text-gray-400">Track and manage your project issues</p>
            </div>

        </div>

        <div class="right flex justify-between items-center gap-2 p-4">
           <div ><i class="fa-solid fa-circle text-green-700"></i><span class="font-bold pl-2">Open</span></div>

           <div ><i class="fa-solid fa-circle text-[#A855F7]"></i><span class="font-bold pl-2">Close</span></div>
        </div>
    </div>


    <!-- top part of 50 issues ends from here -->




    <!-- card container starts from here -->


    <section>
        
    <div id="card-container" class="bottom-part mt-10 px-8 grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-4">

         











        



    </div>

    </section>


     <!-- card container ends from here -->


    


   </section>
    
    <!-- main part starts from here -->   



    <script src="./script/toggle.js"></script>
    <script src="./script/all.js"></script>
</body>

</html>
