<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Issue Tracker</title>

    <!-- google font  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    



    <!-- font awesome  cdn-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />


    <!-- tainwind + daisi ui -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>


    <!-- style css  -->
     <link rel="stylesheet" href="style/style.css">

</head>

<body >


<div class="card bg-base-100 w-[50%]  m-auto mt-30 shadow-2xl">
  <figure class="px-10 pt-10">
    <img
      src="./assets/github-logo.png"
      alt="Shoes"
      class="rounded-xl" />
  </figure>
  <div class="card-body ">
    <h2 class="card-title font-bold text-2xl  mx-auto">GitHub Issues Tracker</h2>
    <p class="text-gray-400 text-[1rem] mx-auto">Sign in to manage your issues</p>
    
    <div id="input-part" class="mt-10">
        <label class="  text-xl m-1"> Username</label><br>
    <input id="input-name" type="text" placeholder="Enter Your name"  class="p-3 text-[1rem] rounded-md w-[95%]">
    <h2 class="text-[#4A00FF] m-1">Default:admin</h2>

     <label class="  text-xl m-1" > Password</label><br>
    <input id="input-pass" type="password" placeholder="Enter Password" class="p-3 text-[1rem] rounded-md w-[95%]">
    <h2 class="text-[#4A00FF] m-1">Default:admin123</h2>
    </div>

    <div id="signin-btn" class="card-actions  ">
      <button class="btn btn-primary w-[95%] ">Sign in</button><br>
    </div>


     <div class="my-6 flex items-center w-[95%] ">
        <div class="flex-grow border-t-3 border-gray-400"></div>
        <span class="mx-4">OR</span> 
        <div class="flex-grow border-t-3 border-gray-400"></div>
     </div>

     <div class="optional text-center w-[95%]">
        <p class="text-gray-500 py-4">Demo Credentials:</p>

        <div class="bg-sky-100 p-4">
            <h1><span class="font-bold">Username</span>:admin</h1>
            <h1><span class="font-bold">Password</span>:admin123</h1>
        </div>

     </div>
     
  </div>
</div>




<script src="./script/login.js"></script>
</body>

</html>
